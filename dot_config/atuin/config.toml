# Atuin — synced shell history

## Search mode — fuzzy matching
search_mode = "fuzzy"

## Style
style = "compact"

## Show preview of command
show_preview = true

## Inline height
inline_height = 20

## Filter modes
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"

## Sync (configure after `atuin login`)
auto_sync = true
sync_frequency = "5m"
sync_address = "https://api.atuin.sh"
